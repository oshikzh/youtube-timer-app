<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>YouTube + Timer App</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<style>
  body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
  .timer-box { margin-top: 20px; }
  input { padding: 5px; }
  button { padding: 8px 15px; margin-left: 5px; }
  #time-display { font-size: 2em; margin-top: 10px; }
  .yt-item { margin: 5px 0; }
  .yt-item button { margin-left: 10px; }
</style>
</head>
<body>

<h2>YouTube + タイマー</h2>

<!-- YouTube 埋め込み -->
<div>
  <iframe id="ytplayer" width="560" height="315"
    src=""
    frameborder="0" allowfullscreen>
  </iframe>
</div>

<hr>

<!-- YouTube リンク管理 -->
<h3>YouTube リンク管理（最大10件）</h3>

<input type="text" id="yt-url" placeholder="YouTube URL を入力" size="40">
<button onclick="addYoutube()">追加</button>

<div id="yt-list"></div>

<hr>

<!-- タイマー -->
<div class="timer-box">
  <label>タイマー（分）:</label>
  <input type="number" id="minutes" min="1" max="60" value="30">
  <button onclick="startTimer()">開始</button>
  <button onclick="stopTimer()">停止</button>

  <div id="time-display">00:00</div>
</div>

<!-- 梵鐘アラーム音（ローカルファイル） -->
<audio id="alarm-sound">
  <source src="otera_kane.mp3" type="audio/mp3">
</audio>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* ------------------------------
   YouTube API プレイヤー
------------------------------ */
let player;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('ytplayer');
}

/* ------------------------------
   YouTube リンク管理
------------------------------ */
let ytLinks = JSON.parse(localStorage.getItem("ytLinks") || "[]");

function saveLinks() {
  localStorage.setItem("ytLinks", JSON.stringify(ytLinks));
}

function renderList() {
  const list = document.getElementById("yt-list");
  list.innerHTML = "";

  ytLinks.forEach((url, index) => {
    const div = document.createElement("div");
    div.className = "yt-item";
    div.innerHTML = `
      <button onclick="loadVideo('${url}')">再生</button>
      ${url}
      <button onclick="deleteLink(${index})">削除</button>
    `;
    list.appendChild(div);
  });
}

function addYoutube() {
  const url = document.getElementById("yt-url").value.trim();
  if (!url) return;

  if (ytLinks.length >= 10) {
    alert("登録できるのは最大10件です");
    return;
  }

  const embed = convertToEmbed(url);
  if (!embed) {
    alert("YouTube の URL を入力してください");
    return;
  }

  ytLinks.push(embed);
  saveLinks();
  renderList();
  document.getElementById("yt-url").value = "";
}

function deleteLink(index) {
  ytLinks.splice(index, 1);
  saveLinks();
  renderList();
}

function loadVideo(url) {
  // ★ 再生ボタンでは「選択」だけ行う（再生しない）
  document.getElementById("ytplayer").src = url + "?enablejsapi=1";
}

function convertToEmbed(url) {
  const match = url.match(/v=([a-zA-Z0-9_-]+)/);
  if (match) return `https://www.youtube.com/embed/${match[1]}`;

  const short = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
  if (short) return `https://www.youtube.com/embed/${short[1]}`;

  return null;
}

renderList();

/* ------------------------------
   タイマー
------------------------------ */
let timerInterval;
let remainingSeconds = 0;

function startTimer() {
  const min = parseInt(document.getElementById("minutes").value);
  if (isNaN(min) || min < 1 || min > 60) return;

  // ★ タイマー開始と同時に YouTube 再生
  if (player) {
    player.playVideo();
  }

  remainingSeconds = min * 60;
  updateDisplay();

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    remainingSeconds--;
    updateDisplay();

    if (remainingSeconds <= 0) {
      clearInterval(timerInterval);
      document.getElementById("alarm-sound").play();

      // ★ 必
