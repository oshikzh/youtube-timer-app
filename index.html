<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>YouTube + Timer App</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<style>
  body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 0 10px; }
  .timer-box { margin-top: 20px; }
  input { padding: 5px; }
  button { padding: 8px 12px; margin-left: 5px; }
  #time-display { font-size: 2em; margin-top: 10px; }
  .yt-item { margin: 8px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .yt-item button { margin-left: 0; }
  #ytplayer { width:100%; max-width:560px; height:315px; background:#000; }
  .small { font-size:0.9em; color:#555; }
</style>
</head>
<body>

<h2>YouTube + タイマー</h2>

<!-- YouTube 埋め込み -->
<div>
  <div id="player-wrap">
    <div id="ytplayer"></div>
  </div>
</div>

<hr>

<!-- YouTube リンク管理 -->
<h3>YouTube リンク管理（最大10件）</h3>

<input type="text" id="yt-url" placeholder="YouTube URL を入力" size="50">
<button id="add-btn">追加</button>
<div class="small">貼り付けると自動で埋め込み URL に変換します。再生ボタンは「選択」のみ。</div>

<div id="yt-list"></div>

<hr>

<!-- タイマー -->
<div class="timer-box">
  <label>タイマー（分）:</label>
  <input type="number" id="minutes" min="1" max="60" value="30">
  <button id="start-btn">開始</button>
  <button id="stop-btn">停止</button>

  <div id="time-display">00:00</div>
</div>

<!-- 梵鐘アラーム音（ローカルファイル） -->
<audio id="alarm-sound" preload="auto">
  <source src="otera_kane.mp3" type="audio/mp3">
</audio>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* ------------------------------
   設定と状態
------------------------------ */
const MAX_LINKS = 10;
const DESIRED_GAIN = 1.2; // 約2割増し

let player; // YT.Player
let selectedVideoId = null;
let ytLinks = JSON.parse(localStorage.getItem("ytLinks") || "[]");

let timerInterval = null;
let remainingSeconds = 0;

/* ------------------------------
   DOM 要素
------------------------------ */
const addBtn = document.getElementById('add-btn');
const startBtn = document.getElementById('start-btn');
const stopBtn = document.getElementById('stop-btn');
const ytUrlInput = document.getElementById('yt-url');
const ytListDiv = document.getElementById('yt-list');
const timeDisplay = document.getElementById('time-display');
const alarmElement = document.getElementById('alarm-sound');

/* ------------------------------
   Web Audio API セットアップ（増幅）
------------------------------ */
let audioCtx = null;
let alarmSourceNode = null;
let alarmGainNode = null;

function setupAlarmAudio() {
  try {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // createMediaElementSource は同じ audio element に対して複数回呼ぶと例外になるので一度だけ
    alarmSourceNode = audioCtx.createMediaElementSource(alarmElement);
    alarmGainNode = audioCtx.createGain();
    alarmGainNode.gain.value = DESIRED_GAIN;
    alarmSourceNode.connect(alarmGainNode);
    alarmGainNode.connect(audioCtx.destination);
  } catch (e) {
    console.warn('Web Audio API を利用できません。HTMLAudio の volume を使ったフォールバックになります。', e);
    audioCtx = null;
    alarmSourceNode = null;
    alarmGainNode = null;
  }
}

function ensureAudioContextResumed() {
  if (!audioCtx) return Promise.resolve();
  if (audioCtx.state === 'suspended') {
    return audioCtx.resume().catch(()=>{});
  }
  return Promise.resolve();
}

/* ------------------------------
   YouTube IFrame API ハンドラ
------------------------------ */
function onYouTubeIframeAPIReady() {
  // 初期は空のプレイヤーを作る（videoId は指定しない）
  player = new YT.Player('ytplayer', {
    height: '315',
    width: '560',
    videoId: '',
    playerVars: {
      'playsinline': 1,
      'enablejsapi': 1,
      'rel': 0
    },
    events: {
      'onReady': onPlayerReady
    }
  });
}

function onPlayerReady(event) {
  // プレイヤー準備完了
}

/* ------------------------------
   YouTube リンク管理
------------------------------ */
function saveLinks() {
  localStorage.setItem("ytLinks", JSON.stringify(ytLinks));
}

function renderList() {
  ytListDiv.innerHTML = "";
  ytLinks.forEach((embedUrl, index) => {
    const id = extractVideoIdFromEmbed(embedUrl);
    const div = document.createElement('div');
    div.className = 'yt-item';
    const playBtn = document.createElement('button');
    playBtn.textContent = '再生';
    playBtn.onclick = () => selectVideoById(id);

    const urlSpan = document.createElement('span');
    urlSpan.textContent = embedUrl;

    const delBtn = document.createElement('button');
    delBtn.textContent = '削除';
    delBtn.onclick = () => {
      deleteLink(index);
    };

    div.appendChild(playBtn);
    div.appendChild(urlSpan);
    div.appendChild(delBtn);
    ytListDiv.appendChild(div);
  });
}

function addYoutube() {
  const url = ytUrlInput.value.trim();
  if (!url) return;
  if (ytLinks.length >= MAX_LINKS) {
    alert("登録できるのは最大10件です");
    return;
  }
  const embed = convertToEmbed(url);
  if (!embed) {
    alert("YouTube の URL を入力してください");
    return;
  }
  ytLinks.push(embed);
  saveLinks();
  renderList();
  ytUrlInput.value = "";
}

  ytLinks.splice(index, 1);
  saveLinks();
  renderList();
