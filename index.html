<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>YouTube + Timer App</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<style>
  body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
  .timer-box { margin-top: 20px; }
  input { width: 80px; padding: 5px; }
  button { padding: 8px 15px; margin-left: 10px; }
  #time-display { font-size: 2em; margin-top: 10px; }
</style>
</head>
<body>

<h2>YouTube + タイマー</h2>

<!-- YouTube 埋め込み -->
<div>
  <iframe id="ytplayer" width="560" height="315"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1"
    frameborder="0" allowfullscreen>
  </iframe>
</div>

<!-- タイマー -->
<div class="timer-box">
  <label>タイマー（分）:</label>
  <input type="number" id="minutes" min="1" max="60" value="10">
  <button onclick="startTimer()">開始</button>
  <button onclick="stopTimer()">停止</button>

  <div id="time-display">00:00</div>
</div>

<!-- アラーム音 -->
<audio id="alarm-sound">
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<script>
let timerInterval;
let remainingSeconds = 0;

function startTimer() {
  const min = parseInt(document.getElementById("minutes").value);
  if (isNaN(min) || min < 1 || min > 60) return;

  remainingSeconds = min * 60;
  updateDisplay();

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    remainingSeconds--;
    updateDisplay();

    if (remainingSeconds <= 0) {
      clearInterval(timerInterval);
      document.getElementById("alarm-sound").play();
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
}

function updateDisplay() {
  const m = String(Math.floor(remainingSeconds / 60)).padStart(2, "0");
  const s = String(remainingSeconds % 60).padStart(2, "0");
  document.getElementById("time-display").textContent = `${m}:${s}`;
}

// PWA Service Worker 登録
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
