<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube + Timer App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        #video-list button {
            display: block;
            margin: 5px auto;
            padding: 10px;
            width: 80%;
        }
        #timer-section {
            margin-top: 20px;
        }
        #timer-display {
            font-size: 2em;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h2>YouTube Player</h2>
    <iframe id="player" width="100%" height="200"
        src="https://www.youtube.com/embed/"
        frameborder="0" allowfullscreen>
    </iframe>

    <h3>登録した動画</h3>
    <div id="video-list"></div>

    <h3>動画を追加</h3>
    <input type="text" id="video-url" placeholder="YouTube URL を入力">
    <button onclick="addVideo()">追加</button>

    <div id="timer-section">
        <h3>タイマー</h3>
        <input type="number" id="minutes" placeholder="分" min="1">
        <button onclick="startTimer()">開始</button>
        <button onclick="stopTimer()">停止</button>
        <div id="timer-display">00:00</div>
    </div>

    <!-- 🔔 タイマー終了時に鳴らす音声 -->
    <audio id="alarm-sound">
        <source src="otera_kane.mp3" type="audio/mp3">
    </audio>

    <script>
        let timerInterval;
        let player;

        // ① YouTube IFrame API が準備できたら呼ばれる
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player');
        }

        function addVideo() {
            const url = document.getElementById("video-url").value;
            const videoId = extractVideoId(url);
            if (!videoId) {
                alert("正しい YouTube URL を入力してください");
                return;
            }

            const list = document.getElementById("video-list");
            const btn = document.createElement("button");
            btn.textContent = url;
            btn.onclick = () => loadVideo(videoId);
            list.appendChild(btn);

            saveVideo(url);
            document.getElementById("video-url").value = "";
        }

        function extractVideoId(url) {
            const match = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }

        function loadVideo(videoId) {
            document.getElementById("player").src =
                "https://www.youtube.com/embed/" + videoId + "?enablejsapi=1";
        }

        function saveVideo(url) {
            const videos = JSON.parse(localStorage.getItem("videos") || "[]");
            videos.push(url);
            localStorage.setItem("videos", JSON.stringify(videos));
        }

        function loadSavedVideos() {
            const videos = JSON.parse(localStorage.getItem("videos") || "[]");
            const list = document.getElementById("video-list");

            videos.forEach(url => {
                const videoId = extractVideoId(url);
                const btn = document.createElement("button");
                btn.textContent = url;
                btn.onclick = () => loadVideo(videoId);
                list.appendChild(btn);
            });
        }

        function startTimer() {
            const minutes = parseInt(document.getElementById("minutes").value);
            if (!minutes || minutes <= 0) return;

            // ② タイマー開始時に YouTube を自動再生
            if (player) {
                player.mute();      // 自動再生を確実にする
                player.playVideo(); // 再生
            }

            let remaining = minutes * 60;

            timerInterval = setInterval(() => {
                remaining--;
                const m = String(Math.floor(remaining / 60)).padStart(2, "0");
                const s = String(remaining % 60).padStart(2, "0");
                document.getElementById("timer-display").textContent = `${m}:${s}`;

                if (remaining <= 0) {
                    clearInterval(timerInterval);

                    // 🔔 タイマー終了時に梵鐘を鳴らす
                    document.getElementById("alarm-sound").play();

                    alert("時間になりました");
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        loadSavedVideos();
    </script>

    <!-- ③ YouTube IFrame API 読み込み -->
    <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
